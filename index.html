<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rizky Aditya Nugroho</title>
<meta name="description" content="Rizky Aditya Nugroho — Lecturer at Universitas NU Sidoarjo. Lectures, research and community service.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     THEME: Brutalism (typeui.sh / awesome-design-skills)
     Tokens from DESIGN.md: primary #DD614C, secondary #DAA144,
     surface #FFFFFF, text #111827 · Darker Grotesque + JetBrains Mono
     ========================================================= */
  :root {
    --primary: #DD614C;      /* coral */
    --secondary: #DAA144;    /* mustard */
    --surface: #FFFFFF;
    --text: #111827;
    --bg: #F4F1EA;           /* raw paper/concrete */
    --line: #111827;         /* hard borders & shadows */
    --muted: #4B5563;
    --hatch: #E7E2D6;
    --bw: 3px;               /* border width */
    --sh: 6px;               /* hard shadow offset */
    --r-sm: 4px; --r-md: 8px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #1F1F1F; --text: #F5F3EE; --bg: #121212; --line: #F5F3EE;
      --muted: #C9C4B8; --hatch: #2A2A2A; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --surface: #1F1F1F; --text: #F5F3EE; --bg: #121212; --line: #F5F3EE;
    --muted: #C9C4B8; --hatch: #2A2A2A; color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Darker Grotesque", system-ui, sans-serif;
    font-size: 20px; font-weight: 600; line-height: 1.3;
    background-color: var(--bg); color: var(--text);
    background-image: linear-gradient(var(--hatch) 1px, transparent 1px), linear-gradient(90deg, var(--hatch) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  a { color: inherit; text-decoration: none; }
  svg { display: block; }
  button { font: inherit; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  :focus-visible { outline: 3px dashed var(--primary); outline-offset: 4px; }

  .layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); min-height: 100vh; }

  /* ---------- Left panel ---------- */
  .side {
    position: sticky; top: 0; height: 100vh;
    background: var(--secondary); color: #111827;
    border-right: var(--bw) solid var(--line);
    display: flex; flex-direction: column;
    padding: 32px 28px 22px;
  }
  .avatar {
    width: 168px; height: 168px; background: var(--surface);
    border: var(--bw) solid #111827; border-radius: var(--r-sm);
    box-shadow: var(--sh) var(--sh) 0 #111827;
  }
  .avatar img, .avatar .initials { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar .initials { display: grid; place-items: center; background: var(--primary); color: #111827; font-size: 64px; font-weight: 900; }
  .name {
    margin-top: 26px; font-size: 60px; font-weight: 900; line-height: .8;
    letter-spacing: -.01em; text-transform: uppercase;
  }
  .name span { color: var(--primary); }
  .tagline {
    margin-top: 14px; display: inline-block; align-self: flex-start;
    font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em;
    background: #111827; color: var(--secondary); padding: 6px 9px;
  }

  .nav { margin-top: 30px; display: flex; flex-direction: column; gap: 10px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 6px 12px; text-align: left;
    background: #FFFFFF; color: #111827;
    border: var(--bw) solid #111827; border-radius: var(--r-sm);
    font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: .01em;
  }
  .nav-item.current { background: var(--primary); box-shadow: 4px 4px 0 #111827; }
  a.nav-item:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 #111827; }
  .nav-item[aria-disabled="true"] { background: transparent; border-style: dashed; color: #3A3A3A; cursor: not-allowed; }
  .nav-item .soon { margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 700; letter-spacing: .06em; }

  .side-foot {
    margin-top: auto; padding-top: 22px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    font-family: "JetBrains Mono", monospace; font-size: 11px; color: #111827;
  }
  .theme-btn {
    flex: none; width: 42px; height: 42px; cursor: pointer;
    background: #FFFFFF; color: #111827;
    border: var(--bw) solid #111827; border-radius: var(--r-sm);
    box-shadow: 3px 3px 0 #111827; display: grid; place-items: center;
  }
  .theme-btn:hover { background: var(--primary); }
  .theme-btn:active { transform: translate(3px, 3px); box-shadow: none; }
  .icon-sun { display: none; }
  :root[data-theme="dark"] .icon-sun { display: block; }
  :root[data-theme="dark"] .icon-moon { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .icon-sun { display: block; }
    :root:not([data-theme="light"]) .icon-moon { display: none; }
  }

  /* ---------- Right panel ---------- */
  .content { padding: 44px clamp(20px, 4vw, 56px) 60px; }
  .view { display: none; max-width: 1100px; }
  .view.active { display: block; }

  .eyebrow {
    display: inline-block; font-family: "JetBrains Mono", monospace;
    font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    background: var(--text); color: var(--bg); padding: 5px 9px;
  }
  .view-title { margin-top: 10px; font-size: clamp(48px, 7vw, 84px); font-weight: 900; line-height: .85; text-transform: uppercase; letter-spacing: -.01em; }
  .view-sub { margin-top: 10px; font-size: 22px; color: var(--muted); font-weight: 700; }
  .view-head { margin-bottom: 30px; }

  .back {
    display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; cursor: pointer;
    padding: 4px 14px 4px 8px; background: var(--surface); color: var(--text);
    border: var(--bw) solid var(--line); border-radius: var(--r-sm); box-shadow: 4px 4px 0 var(--line);
    font-size: 22px; font-weight: 800; text-transform: uppercase;
  }
  .back:hover { background: var(--secondary); color: #111827; }
  .back:active { transform: translate(4px, 4px); box-shadow: none; }

  /* Tiles */
  .tiles { display: grid; gap: 28px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tiles.courses { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }

  .tile {
    position: relative; display: flex; flex-direction: column; overflow: hidden;
    background: var(--surface); color: var(--text);
    border: var(--bw) solid var(--line); border-radius: var(--r-md);
    box-shadow: var(--sh) var(--sh) 0 var(--line);
    transition: transform .12s steps(2), box-shadow .12s steps(2);
  }
  .tile.clickable { cursor: pointer; }
  .tile.clickable:hover { transform: translate(-3px, -3px); box-shadow: calc(var(--sh) + 3px) calc(var(--sh) + 3px) 0 var(--line); }
  .tile.clickable:active { transform: translate(var(--sh), var(--sh)); box-shadow: none; }
  .tile.clickable:hover .go { background: #111827; color: var(--secondary); }

  .media {
    position: relative; aspect-ratio: 16 / 10; overflow: hidden;
    display: grid; place-items: center;
    border-bottom: var(--bw) solid var(--line);
    background: repeating-linear-gradient(45deg, var(--hatch) 0 2px, transparent 2px 12px), var(--surface);
    color: var(--muted);
  }
  .tiles.courses .media { aspect-ratio: 16 / 9; }
  .tile.clickable .media { background: var(--primary); color: #111827; }
  .tiles.courses .tile.clickable:nth-child(even) .media { background: var(--secondary); }
  .media svg { stroke-width: 2.2; }
  .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile.disabled .media img { filter: grayscale(1) contrast(1.1); opacity: .5; }

  .tile-body { display: flex; align-items: center; gap: 14px; padding: 14px 18px 16px; }
  .tile-text { flex: 1; min-width: 0; overflow-wrap: break-word; hyphens: auto; }
  .tile-title { font-size: 34px; font-weight: 900; line-height: .9; text-transform: uppercase; }
  .tiles.courses .tile-title { font-size: 24px; line-height: .95; }
  .tiles.courses .tile-body { padding: 14px 14px 16px; gap: 10px; }
  .tiles.courses .go { width: 38px; height: 38px; }
  .tile-desc { margin-top: 6px; font-size: 20px; font-weight: 700; color: var(--muted); }
  .go {
    flex: none; width: 46px; height: 46px; display: grid; place-items: center;
    background: var(--secondary); color: #111827;
    border: var(--bw) solid #111827; border-radius: var(--r-sm);
  }

  .tile.disabled { cursor: not-allowed; border-style: dashed; box-shadow: none; background: transparent; }
  .tile.disabled .tile-title { color: var(--muted); }
  .chip {
    position: absolute; top: 12px; left: 12px; z-index: 1;
    font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase;
    padding: 4px 8px; border: 2px solid #111827; border-radius: 2px;
  }
  .chip.soon { background: #FFFFFF; color: #111827; }
  .chip.live { background: #111827; color: var(--secondary); }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .side { position: relative; height: auto; border-right: 0; border-bottom: var(--bw) solid var(--line); padding: 24px 16px 22px; }
    .avatar { width: 120px; height: 120px; }
    .name { font-size: 44px; margin-top: 20px; }
    .nav { flex-direction: row; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
    .nav-item { width: auto; font-size: 20px; padding: 4px 10px; }
    .nav-item .soon, .nav-item svg { display: none; }
    .side-foot { position: absolute; top: 24px; right: 16px; margin: 0; padding: 0; }
    .side-foot small { display: none; }
    .content { padding: 30px 16px 44px; }
  }
  @media (max-width: 620px) { .tiles { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
<div class="layout">

  <!-- ================= LEFT PANEL ================= -->
  <aside class="side">
    <div class="avatar">
      <img src="assets/profile.jpg" alt="Rizky Aditya Nugroho"
           onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'initials',textContent:'RN'}))">
    </div>
    <h1 class="name">Rizky<br>Aditya<br>Nugroho<span>.</span></h1>
    <p class="tagline">Lecturer at Universitas NU Sidoarjo</p>

    <nav class="nav" aria-label="Main menu" id="mainNav"></nav>

    <div class="side-foot">
      <small>© <span id="year"></span> Rizky Aditya Nugroho</small>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </aside>

  <!-- ================= RIGHT PANEL ================= -->
  <main class="content">
    <section class="view" id="view-home" aria-labelledby="homeTitle">
      <div class="view-head">
        <div class="eyebrow">Welcome</div>
        <h2 class="view-title" id="homeTitle">Explore my work</h2>
      </div>
      <div class="tiles" id="menuTiles"></div>
    </section>

    <section class="view" id="view-lectures" aria-labelledby="lecturesTitle">
      <button class="back" type="button" id="backBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Back
      </button>
      <div class="view-head">
        <div class="eyebrow">Odd semester 2026/2027</div>
        <h2 class="view-title" id="lecturesTitle">Lectures</h2>
        <p class="view-sub">Course materials — 14 meetings per course.</p>
      </div>
      <div class="tiles courses" id="courseTiles"></div>
    </section>
  </main>
</div>

<script>
  /* =====================================================================
     EDIT HERE
     image : path to a picture for the tile, e.g. "assets/tiles/lectures.jpg"
             (landscape, about 1200×750 px). Leave "" to show the icon.
     ===================================================================== */

  /* Left menu. Set href (e.g. "about.html") and active: true when a page is ready. */
  const NAV = [
    { label: "Home",    icon: "home",   href: "#",  active: true,  current: true },
    { label: "About",   icon: "user",   href: "",   active: false },
    { label: "Resume",  icon: "file",   href: "",   active: false },
    { label: "Contact", icon: "mail",   href: "",   active: false },
  ];

  /* Big tiles on the right. action "lectures" opens the course list; null = coming soon. */
  const MENU = [
    { title: "Lectures",          text: "Course materials I teach",       icon: "book",  image: "", action: "lectures" },
    { title: "Research",          text: "Publications & ongoing work",    icon: "flask", image: "", action: null },
    { title: "Community Service", text: "Community engagement",           icon: "hands", image: "", action: null },
    { title: "Others",            text: "More activities & resources",    icon: "grid",  image: "", action: null },
  ];

  /* Courses. url = address of each course's GitHub Pages site; ready: true = clickable. */
  const COURSES = [
    { name: "Communication Skill",                   url: "/communication-skill/",               ready: true,  icon: "chat",   image: "" },
    { name: "Manajemen Proyek Sistem Informasi",     url: "/manajemen-proyek-si/",               ready: true,  icon: "kanban", image: "" },
    { name: "Transformasi Digital",                  url: "/transformasi-digital/",              ready: true,  icon: "spark",  image: "" },
    { name: "Kepemimpinan dan Manajemen Organisasi", url: "/kepemimpinan-manajemen-organisasi/", ready: true,  icon: "people", image: "" },
    { name: "Data Warehouse",                        url: "/data-warehouse/",                    ready: true, icon: "db",     image: "" },
    { name: "Metode Peramalan",                      url: "/metode-peramalan/",                  ready: true, icon: "trend",  image: "" },
  ];

  /* ---------------------------------------------------------------------- */
  const ICONS = {
    home:   '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    user:   '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    file:   '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
    mail:   '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    book:   '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M9 7h7M9 11h5"/>',
    flask:  '<path d="M9 3h6M10 3v6L4.5 18.5A2 2 0 0 0 6.2 21.5h11.6a2 2 0 0 0 1.7-3L14 9V3"/><path d="M7.5 15h9"/>',
    hands:  '<path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
    grid:   '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    chat:   '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/>',
    kanban: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 7v7M12 7v4M16 7v9"/>',
    spark:  '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 17l.8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8z"/>',
    people: '<circle cx="12" cy="6" r="3"/><path d="M6 21v-2a6 6 0 0 1 12 0v2"/><circle cx="4.5" cy="10" r="2"/><circle cx="19.5" cy="10" r="2"/>',
    db:     '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
    trend:  '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-6"/><path d="M16 8h4v4"/>',
  };
  const svg = (n, s = 24, w = 2) =>
    `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
  const GO = '<span class="go"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>';

  function tile({ title, text, icon, image, href, clickable, big, chip }) {
    const iconSize = big ? 72 : 52;
    const inner = `
      <div class="media">
        ${chip || ""}
        ${svg(icon, iconSize, 1.6)}
        ${image ? `<img src="${image}" alt="" loading="lazy" onerror="this.remove()">` : ""}
      </div>
      <div class="tile-body">
        <div class="tile-text">
          <div class="tile-title">${title}</div>
          ${text ? `<div class="tile-desc">${text}</div>` : ""}
        </div>
        ${clickable ? GO : ""}
      </div>`;
    return clickable
      ? `<a class="tile clickable" href="${href}">${inner}</a>`
      : `<div class="tile disabled" aria-disabled="true">${inner}</div>`;
  }

  document.getElementById("mainNav").innerHTML = NAV.map(n => {
    const cls = "nav-item" + (n.current ? " current" : "");
    const body = `${svg(n.icon, 18)}<span>${n.label}</span>${n.active ? "" : '<span class="soon">Soon</span>'}`;
    return n.active
      ? `<a class="${cls}" href="${n.href}" ${n.current ? 'aria-current="page"' : ""}>${body}</a>`
      : `<span class="${cls}" aria-disabled="true" title="Coming soon">${body}</span>`;
  }).join("");

  document.getElementById("menuTiles").innerHTML = MENU.map(m => tile({
    title: m.title, text: m.text, icon: m.icon, image: m.image, big: true,
    href: "#" + m.action, clickable: !!m.action,
    chip: m.action ? "" : '<span class="chip soon">Coming soon</span>',
  })).join("");

  document.getElementById("courseTiles").innerHTML = COURSES.map(c => tile({
    title: c.name, icon: c.icon, image: c.image, href: c.url, clickable: c.ready,
    chip: c.ready ? '<span class="chip live">Available</span>' : '<span class="chip soon">Coming soon</span>',
  })).join("");

  /* Hash router: #lectures shows the course list, anything else the home tiles. */
  function route() {
    const lectures = location.hash === "#lectures";
    document.getElementById("view-home").classList.toggle("active", !lectures);
    document.getElementById("view-lectures").classList.toggle("active", lectures);
  }
  window.addEventListener("hashchange", () => { route(); window.scrollTo({ top: 0 }); });
  route();
  document.getElementById("backBtn").addEventListener("click", () => {
    history.pushState("", document.title, location.pathname + location.search);
    route();
  });

  /* Theme toggle */
  const root = document.documentElement;
  try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch (e) {}
  document.getElementById("themeBtn").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
  });

  document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
