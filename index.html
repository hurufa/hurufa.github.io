<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rizky Aditya Nugroho</title>
<meta name="description" content="Rizky Aditya Nugroho — Lecturer at Universitas NU Sidoarjo. Lectures, research and community service.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">

  <!-- ================= LEFT PANEL ================= -->
  <aside class="side">
    <div class="avatar">
      <img src="assets/profile.jpg" alt="Rizky Aditya Nugroho"
           onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'initials',textContent:'RN'}))">
    </div>
    <h1 class="name">Rizky<br>Aditya<br>Nugroho<span>.</span></h1>
    <p class="tagline">Lecturer at Universitas NU Sidoarjo</p>

    <nav class="nav" aria-label="Main menu" id="mainNav"></nav>

    <div class="side-foot">
      <small>© <span id="year"></span> Rizky Aditya Nugroho</small>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </aside>

  <!-- ================= RIGHT PANEL ================= -->
  <main class="content">
    <section class="view" id="view-home" aria-labelledby="homeTitle">
      <div class="view-head">
        <div class="eyebrow">Welcome</div>
        <h2 class="view-title" id="homeTitle">Explore my work</h2>
      </div>
      <div class="tiles" id="menuTiles"></div>
    </section>

    <section class="view" id="view-lectures" aria-labelledby="lecturesTitle">
      <button class="back" type="button" id="backBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Back
      </button>
      <div class="view-head">
        <div class="eyebrow">Odd semester 2026/2027</div>
        <h2 class="view-title" id="lecturesTitle">Lectures</h2>
        <p class="view-sub">Course materials — 14 meetings per course.</p>
      </div>
      <div class="tiles courses" id="courseTiles"></div>
    </section>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
